
<svg xmlns="http://www.w3.org/2000/svg"
     width="1920" height="1080"
     viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F0E3"/>
      <stop offset="55%" stop-color="#F2E5D2"/>
      <stop offset="100%" stop-color="#F9F1E5"/>
    </linearGradient>

    <filter id="fiber">
      <feTurbulence type="fractalNoise"
        baseFrequency="0.65"
        numOctaves="2" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>

    <pattern id="lines" width="37" height="29"
             patternUnits="userSpaceOnUse">
      <path d="M2 8 l12 -1 M22 21 l9 1 M8 27 l5 -1"
        stroke="#9D8264" stroke-width=".55"
        opacity=".18" fill="none"/>
    </pattern>
  </defs>

  <!-- Dasar kertas gading -->
  <rect width="1920" height="1080" fill="url(#paper)"/>

  <!-- Serat kertas -->
  <rect width="1920" height="1080"
        filter="url(#fiber)" opacity=".22"/>

  <rect width="1920" height="1080"
        fill="url(#lines)"/>

  <!-- Ornamen sudut emas -->
  <g fill="none" stroke="#C49A43"
     stroke-width="2" opacity=".8">
    <path d="M60 100 V55 H150"/>
    <path d="M1770 55 H1860 V145"/>
    <path d="M60 935 V1025 H150"/>
    <path d="M1770 1025 H1860 V935"/>
  </g>

  <g fill="#C49A43" opacity=".8">
    <circle cx="105" cy="55" r="3"/>
    <circle cx="1815" cy="1025" r="3"/>
  </g>
</svg>
